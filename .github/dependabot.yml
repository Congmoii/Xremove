version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned upstream algorithm repositories require manual review and verification
      - dependency-name: "gemini-watermark-remover"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
