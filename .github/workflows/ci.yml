name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Fetch and verify pinned model
        run: pnpm run fetch:model

      - name: Bootstrap pinned service dependency
        run: pnpm run bootstrap:vendor

      - name: Install FFmpeg for legacy service integration test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify standalone HTML in browser
        run: node tests/verify_standalone_text_e2e.mjs
